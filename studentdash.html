<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard | STEM Explorer</title>
  <link rel="stylesheet" href="studentdash.css">
<style>
/* Dark Mode */
body.dark { background: #0f0c29 !important; color: #f0f0f0 !important; }
body.dark .navbar { background: #1a1a2e !important; color: #f0f0f0 !important; }
body.dark .logo { color: #f0f0f0 !important; }
body.dark .welcome { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .streak-box { background: rgba(30, 30, 60, 0.6) !important; color: #f0f0f0 !important; }
body.dark .card { background: #1e1e3f !important; color: #f0f0f0 !important; }
body.dark .section-title { color: #f0f0f0 !important; }
body.dark .notes { background: #1a1a2e !important; color: #f0f0f0 !important; }
body.dark #note-input { background: #0f0c29 !important; color: #f0f0f0 !important; border-color: #444 !important; }
body.dark .motivation-corner { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark h2, body.dark h3, body.dark p, body.dark small { color: #f0f0f0 !important; }

.dark-toggle {
  background: none;
  border: 2px solid #6A11CB;
  border-radius: 50px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  color: #6A11CB;
  transition: all 0.3s ease;
}
.dark-toggle:hover { background: #6A11CB; color: white; }
</style>
</head>
<body>
  <!-- ===== Navbar ===== -->
  <header class="navbar">
    <div class="logo">🔥 IGNITERA</div>
    <header class="navbar">
  <div class="logo">🔥 IGNITERA</div>
  <button class="dark-toggle" onclick="toggleDarkMode()" id="darkBtn">🌙 Dark</button>  <!-- ADD THIS -->
  <div class="xp-section">
    <div class="xp-section">
      <span class="xp-label">XP</span>
      <div class="xp-bar"><div id="xp-progress"></div></div>
      <span id="xp-value">0 / 100</span>
    </div>
    <div class="profile">
      <img src="depositphotos_666884960-stock-illustration-default-anonymous-user-portrait-icon.jpg" class="avatar" alt="profile" />
      <div class="profile-text">
        <p>Vishakha</p>
        <small>Student</small>
      </div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>
  </header>

  <!-- ===== Welcome Section ===== -->
  <section class="welcome">
    <h2 id="greeting">Good Morning, Student!</h2>
    <div class="streak-box">
      <p id="streak">🔥 Streak: 0 days</p>
      <p id="motivation-text">Keep going! You’re improving 🚀</p>
    </div>
  </section>

  <!-- ===== Main Cards ===== -->
  <h3 class="section-title">🚀 Quick Actions</h3>
  <section class="main-cards">
    <div class="card" onclick="goTo('course.html')">📚 <span>Courses</span></div>
    <div class="card" onclick="goTo('quizz.html')">🎯 <span>Quizzes</span></div>
    <div class="card" onclick="goTo('progress.html')">📊 <span>Progress</span></div>
    <div class="card" onclick="goTo('leaderboard.html')">🏆 <span>Leaderboard</span></div>
    <div class="card card-primary" onclick="goTo('dailychallenge.html')">⚡ <span>Daily Mission</span></div>
  </section>

  <!-- ===== Notes Section ===== -->
  <section class="notes">
    <h3>📝 Your Notes</h3>
    <textarea id="note-input" placeholder="Write your ideas, formulas, or reminders..."></textarea>
    <button class="btn" onclick="saveNote()">Save Note</button>
    <ul id="notes-list"></ul>
  </section>

  <!-- ===== Motivational Corner ===== -->
  <section class="motivation-corner">
    <h3>💡 Motivation Corner</h3>
    <p id="motivation-rotate"></p>
  </section>
<script>
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', isDark);
  document.getElementById('darkBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
  document.getElementById('darkBtn').textContent = '☀️ Light';
}
</script>
<script src="studentdash.js"></script>
  <script src="studentdash.js"></script>
</body>
</html>
