<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Mission | Student Portal</title>
  <link rel="stylesheet" href="dailychallenge.css">
  <style>
/* Dark Mode */
body.dark { background: #0f0c29 !important; color: #f0f0f0 !important; }
body.dark .navbar { background: #1a1a2e !important; }
body.dark .logo { color: #f0f0f0 !important; }
body.dark .challenge { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark #challenge-answer {
  background: #0f0c29 !important;
  color: #f0f0f0 !important;
  border-color: #444 !important;
}
body.dark .noticeboard { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .noticeboard li { color: #f0f0f0 !important; }
body.dark h2, body.dark p, body.dark small { color: #f0f0f0 !important; }

.dark-toggle {
  background: none;
  border: 2px solid #6A11CB;
  border-radius: 50px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  color: #6A11CB;
  transition: all 0.3s ease;
}
.dark-toggle:hover { background: #6A11CB; color: white; }
</style>
</head>
<body>
  <!-- ===== Navbar ===== -->
  <div class="navbar">
    <div class="logo">🎯 Daily Mission</div>
    <div class="navbar">
  <div class="logo">🎯 Daily Mission</div>
  <button class="dark-toggle" onclick="toggleDarkMode()" id="darkBtn">🌙 Dark</button>  <!-- ADD THIS -->
  <div class="xp-section">
    <div class="xp-section">
      <span class="xp-label">XP:</span>
      <div class="xp-bar">
        <div id="xp-progress" style="width: 40%"></div>
      </div>
    </div>
    <div class="profile">
      <img src="depositphotos_666884960-stock-illustration-default-anonymous-user-portrait-icon.jpg" class="avatar" alt="profile" />
      <div class="profile-text">
        <p>Vishakha</p>
        <small>Student</small>
      </div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>

  <!-- ===== Today’s Challenge ===== -->
  <section class="challenge">
    <h2>⚡ Today’s Challenge</h2>
    <p id="challenge-text">Solve: What is the capital of France?</p>
    <input type="text" id="challenge-answer" placeholder="Enter your answer...">
    <button id="submit-challenge" class="btn">Submit</button>
    <p id="challenge-feedback"></p>
  </section>

  <!-- ===== Teacher’s Noticeboard ===== -->
  <section class="noticeboard">
    <h2>📢 Teacher’s Noticeboard</h2>
    <ul id="notice-list">
      <li>📖 Complete Science Chapter 3 before Friday.</li>
      <li>📝 Submit Math assignment by tomorrow.</li>
      <li>🎉 Don’t forget the quiz competition this weekend!</li>
    </ul>
  </section>
<script>
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', isDark);
  document.getElementById('darkBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
  document.getElementById('darkBtn').textContent = '☀️ Light';
}
</script>
<script src="dailychallenge.js"></script>
  <script src="dailychallenge.js"></script>
</body>
</html>
