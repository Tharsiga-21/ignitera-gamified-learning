<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard | STEM Explorer</title>
  <link rel="stylesheet" href="leaderboard.css">
  <style>
/* Dark Mode */
body.dark { background: #0f0c29 !important; color: #f0f0f0 !important; }
body.dark .navbar { background: #1a1a2e !important; }
body.dark .logo { color: #f0f0f0 !important; }
body.dark .welcome { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .main-cards { background: transparent !important; }
body.dark .card { background: #1e1e3f !important; color: #f0f0f0 !important; }
body.dark .motivation-corner { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .badge { background: #2a2a50 !important; color: #f0f0f0 !important; }
body.dark h2, body.dark h3, body.dark p, body.dark small { color: #f0f0f0 !important; }

.dark-toggle {
  background: none;
  border: 2px solid #6A11CB;
  border-radius: 50px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  color: #6A11CB;
  transition: all 0.3s ease;
}
.dark-toggle:hover { background: #6A11CB; color: white; }
</style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">🔥 IGNITERA</div>
    <header class="navbar">
  <div class="logo">🔥 IGNITERA</div>
  <button class="dark-toggle" onclick="toggleDarkMode()" id="darkBtn">🌙 Dark</button>  <!-- ADD THIS -->
  <div class="xp-section">
    <div class="xp-section">
      <span class="xp-label">XP</span>
      <div class="xp-bar"><div id="xp-progress"></div></div>
    </div>
    <div class="profile">
      <img src="depositphotos_666884960-stock-illustration-default-anonymous-user-portrait-icon.jpg" class="avatar" alt="profile" />
      <div class="profile-text">
        <p>Vishakha</p>
        <small>Student</small>
      </div>
      <button id="logout-btn">Logout</button>
    </div>
  </div>
  </header>

  <!-- Main Leaderboard Section -->
  <main>
    <section class="welcome">
      <h2>🏆 Leaderboard</h2>
      <p>Compete with your classmates and climb the ranks 🚀</p>
    </section>

    <section class="main-cards" id="leaderboard-cards">
      <!-- JS will inject top 5 student cards -->
    </section>

    <section class="motivation-corner">
      <h3>⭐ Achievements & Tips</h3>
      <p id="motivation-text">🔥 You’re in Top 3 of your class!</p>
      <div class="badges">
        <span class="badge">🎯 Quiz Master</span>
        <span class="badge">📚 Knowledge Seeker</span>
        <span class="badge">⚡ Streak 7 Days</span>
      </div>
    </section>
  </main>
<script>
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', isDark);
  document.getElementById('darkBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
  document.getElementById('darkBtn').textContent = '☀️ Light';
}
</script>
<script src="leaderboard.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
