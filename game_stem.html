<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Challenge | STEM Explorer</title>
  <link rel="stylesheet" href="game_stem.css">
  <style>
/* Dark Mode */
body.dark { background: #0f0c29 !important; color: #f0f0f0 !important; }
body.dark .navbar { background: #1a1a2e !important; }
body.dark .logo { color: #f0f0f0 !important; }
body.dark .game-container { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .challenge-box { background: #1a1a2e !important; color: #f0f0f0 !important; border-color: #444 !important; }
body.dark #typingArea { background: #0f0c29 !important; color: #f0f0f0 !important; border-color: #444 !important; }
body.dark .motivation-corner { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .badge { background: #2a2a50 !important; color: #f0f0f0 !important; }
body.dark .result { color: #f0f0f0 !important; }
body.dark h2, body.dark h3, body.dark p, body.dark small { color: #f0f0f0 !important; }

.dark-toggle {
  background: none;
  border: 2px solid #6A11CB;
  border-radius: 50px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  color: #6A11CB;
  transition: all 0.3s ease;
}
.dark-toggle:hover { background: #6A11CB; color: white; }
</style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">IGNITERA</div>
    <header class="navbar">
  <div class="logo">IGNITERA</div>
  <button class="dark-toggle" onclick="toggleDarkMode()" id="darkBtn">🌙 Dark</button>  <!-- ADD THIS -->
  <div class="xp-section">
    <div class="xp-section">
      <span class="xp-label">XP:</span>
      <div class="xp-bar"><div id="xp-progress"></div></div>
      <span id="xp-points">0</span>
    </div>
    <div class="profile">
      <img src="https://via.placeholder.com/42" class="avatar" alt="student avatar">
      <div class="profile-text">
        <p>Student</p>
        <small>Class 8</small>
      </div>
    </div>
  </header>

  <!-- Game Container -->
  <main class="game-container">
    <h2>⌨️ Typing Speed Challenge</h2>
    <p class="instructions">Type the given sentence as fast and accurately as possible.</p>

    <div class="challenge-box" id="challengeText">Press "Start" to begin</div>

    <textarea id="typingArea" placeholder="Start typing here..." disabled></textarea>

    <div class="controls">
      <button id="startBtn" class="btn">Start</button>
    </div>

    <div class="result" id="resultBox"></div>
  </main>

  <!-- Motivation + Badges -->
  <section class="motivation-corner">
    <h3>🏅 Achievements</h3>
    <div class="badges">
      <div class="badge" id="badge-speed">⚡ Fast Typer</div>
      <div class="badge" id="badge-accuracy">🎯 Accuracy Pro</div>
      <div class="badge" id="badge-master">🏆 Typing Master</div>
    </div>
    <p id="motivation-text">Keep practicing, every keystroke makes you stronger! 🚀</p>
  </section>
<script>
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', isDark);
  document.getElementById('darkBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
  document.getElementById('darkBtn').textContent = '☀️ Light';
}
</script>
<script src="game_stem.js"></script>
  <script src="game_stem.js"></script>
</body>
</html>
