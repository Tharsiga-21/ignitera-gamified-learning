<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard | STEM Platform</title>
 <link rel="stylesheet" href="teacherdashboard.css">
<style>
/* Dark Mode */
body.dark { background: #0f0c29 !important; color: #f0f0f0 !important; }
body.dark .navbar { background: #1a1a2e !important; color: #f0f0f0 !important; }
body.dark .logo { color: #f0f0f0 !important; }
body.dark .welcome { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark .streak-box { background: rgba(30, 30, 60, 0.6) !important; color: #f0f0f0 !important; }
body.dark .card { background: #1e1e3f !important; color: #f0f0f0 !important; }
body.dark .notes { background: #1a1a2e !important; color: #f0f0f0 !important; }
body.dark #note-input { background: #0f0c29 !important; color: #f0f0f0 !important; border-color: #444 !important; }
body.dark .motivation-corner { background: rgba(30, 30, 60, 0.8) !important; color: #f0f0f0 !important; }
body.dark h2, body.dark h3, body.dark p, body.dark small { color: #f0f0f0 !important; }

.dark-toggle {
  background: none;
  border: 2px solid #6A11CB;
  border-radius: 50px;
  padding: 6px 14px;
  cursor: pointer;
  font-size: 0.9rem;
  color: #6A11CB;
  transition: all 0.3s ease;
}
.dark-toggle:hover { background: #6A11CB; color: white; }
</style>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">IGNITERA</div>
    <header class="navbar">
  <div class="logo">IGNITERA</div>
  <button class="dark-toggle" onclick="toggleDarkMode()" id="darkBtn">🌙 Dark</button>  <!-- ADD THIS -->
  <div class="profile">
    <div class="profile">
      <img src="depositphotos_666884960-stock-illustration-default-anonymous-user-portrait-icon.jpg" alt="Teacher Avatar" class="avatar">
      <div class="profile-text">
        <p id="teacherName">Teacher</p>
        <small id="teacherClass">Class: 8</small>
      </div>
      <button id="logout-btn">Logout</button>
    </div>
  </header>

  <!-- Welcome Section -->
  <section class="welcome">
    <h2 id="greeting"></h2>
    <p>Welcome back, <span id="teacherNameWelcome"></span> 👩‍🏫</p>
    <p class="streak-box">📅 Today’s Goal: Review student progress!</p>
  </section>

  <!-- Main Cards -->
  <main class="main-cards">
    <div class="card" onclick="navigateTo('manage-courses.html')">📚 <span>Manage Courses</span></div>
    <div class="card" onclick="navigateTo('student-progress.html')">📊 <span>Student Progress</span></div>
    <div class="card" onclick="navigateTo('quiz-management.html')">🎯 <span>Quiz Management</span></div>
    <div class="card" onclick="navigateTo('leaderboard.html')">🏆 <span>Leaderboard</span></div>
    <div class="card" onclick="navigateTo('messages.html')">✉️ <span>Messages</span></div>
  </main>

  <!-- Notes Section -->
  <section class="notes">
    <h3>📒 Teacher Notes</h3>
    <textarea id="note-input" placeholder="Write class notes or reminders..."></textarea>
    <button class="btn" onclick="saveNote()">Save Note</button>
    <button class="btn" onclick="clearNote()">Clear</button>
    <ul id="notes-list"></ul>
  </section>

  <!-- Motivation Corner -->
  <section class="motivation-corner">
    <h3>💡 Teaching Tip</h3>
    <p id="tipText"></p>
  </section>
<script>
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('darkMode', isDark);
  document.getElementById('darkBtn').textContent = isDark ? '☀️ Light' : '🌙 Dark';
}
if (localStorage.getItem('darkMode') === 'true') {
  document.body.classList.add('dark');
  document.getElementById('darkBtn').textContent = '☀️ Light';
}
</script>
<script src="teacherdashboard.js"></script>
  <script src="teacherdashboard.js"></script>
</body>
</html>
